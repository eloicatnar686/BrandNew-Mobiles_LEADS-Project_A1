<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BrandNew Mobile/signup</title>
    <link type="text/css" rel="stylesheet" href="signup.css">

</head>
<body>
<header>
    <div id="capçalera">
        <div class="logo">
            <img src="../MEDIA/logo_white.svg" alt="logo">
        </div>
        <div class="form_main">
            <form action="#" method="GET" class="form">
                <label for="caja-busqueda" id="label_form1">Buscar:</label>
                <input type="search" id="caja-busqueda" name="q" placeholder="Que vols buscar...">
                <button type="submit" id="submit">🔍</button>
            </form>
        </div>
        <div class="carrito">
            <a href="carrito.html" aria-label="Ver carrito de compras">
            <svg fill="currentColor" class="bi bi-basket2-fill" viewBox="0 0 16 16">
                <path d="M5.929 1.757a.5.5 0 1 0-.858-.514L2.217 6H.5a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h.623l1.844 6.456A.75.75 0 0 0 3.69 15h8.622a.75.75 0 0 0 .722-.544L14.877 8h.623a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5h-1.717L10.93 1.243a.5.5 0 1 0-.858.514L12.617 6H3.383zM4 10a1 1 0 0 1 2 0v2a1 1 0 1 1-2 0zm3 0a1 1 0 0 1 2 0v2a1 1 0 1 1-2 0zm4-1a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0v-2a1 1 0 0 1 1-1"/>
            </svg>
            </a>
        </div>
    </div>
    <div class="Menu">
        <nav>
            <a href="../main/main.html">Inici</a>
            <a href="../cataleg/cataleg.html">Catàleg</a>
            <a href="../condicions/condicions.html">Condicions</a>
            <a href="../signup/signup.html">Donar-se d'alta</a>
        </nav>
    </div>
</header>
<div class="contenedor_form">
    <form action="#">
        <div>
            <label for="name">Nom</label>
            <input id="name" type="text" required placeholder="Introdueix el teu nom...">
        </div>
        <div>
            <label for="last_name">Cognoms</label>
            <input id="last_name" type="text" required placeholder="Introdueix el teu cognom...">
        </div>
        <div>
            <label for="tel">Nº Teléfon</label>
            <input id="tel" type="text" placeholder="Introdueix el teu teléfon...">
        </div>
        <div>
            <label for="email">E-mail</label>
            <input id="email" type="text" placeholder="Introdueix el teu e-mail...">
        </div>
        <div>
            <label for="naix">Data de Naixament</label>
            <input id="naix" type="date" required>
        </div>


        <input type="submit">
    </form>
</div>
</body>

</html>
